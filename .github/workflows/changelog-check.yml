# Comprueba las reglas de versionamiento en los PR hacia `dev` (ver changelog/README.md):
# un archivo de changelog por PR y nadie toca la versión ni CHANGELOG.md. Es rápido: no instala dependencias.
name: Changelog

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Comprobar changelog y versión
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/check-changelog.mjs
