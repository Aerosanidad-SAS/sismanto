# Despliega en Vercel desde GitHub Actions con la CLI. La integración nativa de
# Vercel con GitHub NO funciona mientras el team sea Hobby: rechaza los repos
# privados de una organización ("Cannot deploy from a private GitHub
# organization repository on the Hobby plan"). Con la CLI despliega el token
# del proyecto, pero la CLI adjunta el autor del commit y Hobby bloquea el
# despliegue (BLOCKED) si ese autor no es el dueño de la cuenta. Por eso el job
# despliega desde una copia de la salida de `vercel build` sin .git, de modo que
# el despliegue no lleva autor. Si Vercel aun así lo bloquea, el job falla
# rápido con el motivo. Es un parche mientras el team es Hobby: la salida
# limpia es Vercel Pro (o su prueba de 14 días), y con eso se borra este archivo.
#
# Proyecto: `sismanto` del team `tecnicoaerosanidad`. Requiere los secretos
# VERCEL_TOKEN (token de ese team), VERCEL_ORG_ID y VERCEL_PROJECT_ID.
# Al pasar a Vercel Pro se puede volver a la integración nativa y borrar esto.
name: Deploy

on:
  push:
    branches: [dev, staging]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Dominio estable por rama (ver ENTORNOS.md).
      ALIAS: ${{ github.ref_name == 'staging' && 'sismanto-staging.vercel.app' || 'sismanto-dev.vercel.app' }}
    steps:
      - name: Verificar credenciales de Vercel
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta el secreto $v (Settings → Secrets and variables → Actions)."
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm install --global vercel@latest

      # Las variables de entorno de Preview del proyecto (apuntan a la Supabase
      # de staging) las trae `vercel pull`: no viven en este repo.
      - run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - run: vercel build --token="$VERCEL_TOKEN"

      # --no-wait returns as soon as the deployment exists. Without it the CLI
      # sits in "Building…" for minutes when Vercel blocks the deployment
      # (Hobby plan: commit author is not the account owner), so poll the API
      # ourselves and fail fast with the reason Vercel gives.
      - name: Deploy and wait for the result
        run: |
          # Deploy from a copy of the prebuilt output that has no .git: the CLI
          # then attaches no commit author and Hobby has nothing to compare to
          # the account owner. Nothing is falsified — the deployment simply
          # carries no git author. Tested: same project, READY, HTTP 200.
          work=$(mktemp -d)
          cp -r .vercel "$work/.vercel"
          cd "$work"
          url=$(vercel deploy --prebuilt --archive=tgz --no-wait --token="$VERCEL_TOKEN")
          host="${url#https://}"
          echo "Deployment: $url"
          echo "- \`${{ github.ref_name }}\` → $url" >> "$GITHUB_STEP_SUMMARY"

          state=""
          for i in $(seq 1 40); do
            resp=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID")
            state=$(echo "$resp" | jq -r '.readyState // "UNKNOWN"')
            case "$state" in
              READY) break ;;
              BLOCKED|ERROR|CANCELED)
                reason=$(echo "$resp" | jq -r '.readyStateReason // .error.message // "no reason given"')
                echo "::error::Deployment $state: $reason"
                echo "- ❌ $state: $reason" >> "$GITHUB_STEP_SUMMARY"
                exit 1 ;;
            esac
            sleep 15
          done

          if [ "$state" != "READY" ]; then
            echo "::error::Deployment still $state after 10 minutes."
            exit 1
          fi

          # The alias can fail while the domain still belongs to the old
          # project; the deployment itself is fine, so don't fail the job.
          if vercel alias set "$url" "$ALIAS" --token="$VERCEL_TOKEN"; then
            echo "  alias: https://$ALIAS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not set alias $ALIAS; use $url"
          fi
